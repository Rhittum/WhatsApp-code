<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coin Flip Renderer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000; /* Solid black background for easy video compositing */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            perspective: 1000px; /* Gives the scene 3D depth */
        }
        
        /* The 3D Scene Wrapper */
        .coin-viewport {
            width: 200px;
            height: 200px;
            position: relative;
        }

        /* The actual 3D Coin structure */
        .coin {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            /* Custom cubic-bezier creates a dramatic high-velocity launch and heavy slowing torque */
            transition: transform 2.2s cubic-bezier(0.15, 0.85, 0.35, 1);
        }

        /* Base properties for both faces */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden; /* Crucial: hides the back side during 3D rotation */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            font-size: 24px;
            border: 8px solid #b58900;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 0 15px rgba(181, 137, 0, 0.4);
        }

        /* Front Face (Heads) styling */
        .heads {
            background: linear-gradient(45deg, #f1c40f, #d4ac0d);
            color: #7d5d00;
            transform: rotateY(0deg);
        }

        /* Back Face (Tails) styling */
        .tails {
            background: linear-gradient(45deg, #f39c12, #d68910);
            color: #7e4a00;
            /* Flipped 180 degrees initially so it is back-to-back with heads */
            transform: rotateY(180deg);
        }

        /* Center details inside the coin faces */
        .inner-circle {
            width: 82%;
            height: 82%;
            border: 2px dashed rgba(0,0,0,0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div class="coin-viewport">
        <div class="coin" id="coin">
            <!-- Front Face -->
            <div class="face heads">
                <div class="inner-circle">HEADS</div>
            </div>
            <!-- Back Face -->
            <div class="face tails">
                <div class="inner-circle">TAILS</div>
            </div>
        </div>
    </div>

    <script>
        const coinElement = document.getElementById('coin');

        /**
         * Global execution controller for Puppeteer invocation
         * @param {string} result - Expects either 'Heads' or 'Tails'
         * @returns {Promise<string>} Resolves with the result when the animation sequence ends
         */
        window.flipCoin = function(result) {
            return new Promise((resolve) => {
                // Ensure matching configuration input case
                const Target = result.trim().toLowerCase();
                
                // Add a baseline of 5 full 3D flips (180 deg * 10) so it spins incredibly fast
                const baselineFlips = 180 * 10; 
                
                let targetDegrees = 0;
                if (Target === 'heads') {
                    // Ends on a multiple of 360 degrees
                    targetDegrees = baselineFlips; 
                } else {
                    // Ends on an extra 180 degree offset to show the backside
                    targetDegrees = baselineFlips + 180; 
                }

                // Add a small 5-degree random tilt on the X-axis so it looks naturally organic, not clinical
                const subtleXTilt = (Math.random() * 10) - 5;

                // Execute the CSS hardware transformation
                coinElement.style.transform = `rotateX(${subtleXTilt}deg) rotateY(${targetDegrees}deg)`;

                // Resolve the promise exactly when the CSS transition timing block expires (2200ms)
                setTimeout(() => {
                    resolve(result);
                }, 2200);
            });
        }
    </script>
</body>
</html>
